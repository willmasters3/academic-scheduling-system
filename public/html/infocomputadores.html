<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Computadores</title>
    <link rel="shortcut icon" type="image/x-png" href="/imagens/favicon-demo.svg" />
    <link rel="stylesheet" href="../css/infocomputadores.css"> <!-- Link do CSS -->
    
</head>
<body>
    <h1>Lista de Computadores</h1>
    <div class="topbar-filtros">
        <label class="filtro-alerta">
            <input type="checkbox" id="filtroDiscoCritico">
            <span>Mostrar apenas computadores com menos de 10 GB em disco</span>
        </label>
    </div>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                    <th>Último Usuário Logado</th>
                <th>Nome do Computador</th>
                <th>Serial Number</th>
                <th>Endereço MAC</th>                
                <th>Patrimônio</th>
                <th>Data de Registro</th>
                <th>Informações da CPU</th>
                <th>Memória RAM</th>
                <th>Informações do Disco</th>
                <th>Endereço IP</th>
                
            </tr>
        </thead>
        <tbody id="computadores-list">
            <!-- Os dados dos computadores serão inseridos aqui -->
        </tbody>
    </table>

    <script src="../js/security-utils.js"></script>
    <script src="../js/infocomputadores.js">    
    </script>
</body>
</html>
